name: site

# Refresh the PR snapshot from the GitHub API, build the site and publish it
# on GitHub Pages. Every push and pull request builds (so a broken fetch or
# build shows up there); only main and the schedule publish.
on:
  push:
  pull_request:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # The workflow token reads public repositories, with a rate limit far
      # above the ~200 requests a refresh costs. If the API is down the
      # committed snapshot in data/ is published instead, with a warning.
      - name: Refresh the PR snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch || echo "::warning::GitHub API fetch failed; building from the committed snapshot"

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
